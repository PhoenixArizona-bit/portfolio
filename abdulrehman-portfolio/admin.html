<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Abdulrehman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .admin-wrap{ max-width:720px; margin:60px auto; padding:0 22px; }
  .admin-card{ background:var(--panel); border:3px solid var(--ink); border-radius:20px; box-shadow:6px 6px 0 var(--ink); padding:28px; }
  .admin-login{ display:flex; flex-direction:column; gap:14px; max-width:360px; margin:0 auto; }
  .admin-login input{
    font-family:'Poppins',sans-serif; font-size:15px; border:2.5px solid var(--ink); border-radius:12px;
    padding:11px 14px; background:var(--cream); outline:none;
  }
  .admin-field{ display:flex; flex-direction:column; gap:6px; margin-bottom:18px; }
  .admin-field label{ font-size:13px; font-weight:600; color:var(--stone); }
  .admin-field input, .admin-field textarea{
    font-family:'Poppins',sans-serif; font-size:15px; border:2.5px solid var(--ink); border-radius:12px;
    padding:11px 14px; background:var(--cream); outline:none; resize:vertical;
  }
  .admin-section-title{ font-family:'Fredoka',sans-serif; font-size:18px; margin:28px 0 14px; }
  .admin-section-title:first-child{ margin-top:0; }
  .admin-status{ font-weight:600; font-size:14px; margin-top:10px; min-height:20px; }
  .admin-status.ok{ color:#1F8A5A; }
  .admin-status.err{ color:var(--coral); }
</style>
</head>
<body style="background:var(--cream);">

<div class="admin-wrap">

  <div id="login-view" class="admin-card">
    <h2 style="margin-bottom:18px;">Admin login</h2>
    <div class="admin-login">
      <input type="password" id="admin-password" placeholder="Password">
      <button type="button" id="login-btn" class="btn btn-solid">Log in</button>
      <p class="admin-status" id="login-status"></p>
    </div>
  </div>

  <div id="edit-view" class="admin-card" hidden>
    <h2 style="margin-bottom:4px;">Edit site text</h2>
    <p style="color:var(--stone); font-size:14px; margin-bottom:20px;">Changes go live on the site as soon as you save each field.</p>

    <div class="admin-section-title">Home page</div>
    <div class="admin-field"><label>Hero paragraph</label><textarea rows="3" data-key="hero_lede"></textarea><button type="button" class="btn btn-outline save-btn" data-key="hero_lede">Save</button></div>
    <div class="admin-field"><label>About — paragraph 1 (after "I build solo, on purpose.")</label><textarea rows="3" data-key="about_p1"></textarea><button type="button" class="btn btn-outline save-btn" data-key="about_p1">Save</button></div>
    <div class="admin-field"><label>About — paragraph 2</label><textarea rows="3" data-key="about_p2"></textarea><button type="button" class="btn btn-outline save-btn" data-key="about_p2">Save</button></div>
    <div class="admin-field"><label>About — paragraph 3</label><textarea rows="3" data-key="about_p3"></textarea><button type="button" class="btn btn-outline save-btn" data-key="about_p3">Save</button></div>

    <div class="admin-section-title">Services page</div>
    <div class="admin-field"><label>Intro paragraph</label><textarea rows="3" data-key="services_intro"></textarea><button type="button" class="btn btn-outline save-btn" data-key="services_intro">Save</button></div>
    <div class="admin-field"><label>Service 1 — title</label><input data-key="service_1_title"><button type="button" class="btn btn-outline save-btn" data-key="service_1_title">Save</button></div>
    <div class="admin-field"><label>Service 1 — description</label><input data-key="service_1_desc"><button type="button" class="btn btn-outline save-btn" data-key="service_1_desc">Save</button></div>
    <div class="admin-field"><label>Service 2 — title</label><input data-key="service_2_title"><button type="button" class="btn btn-outline save-btn" data-key="service_2_title">Save</button></div>
    <div class="admin-field"><label>Service 2 — description</label><input data-key="service_2_desc"><button type="button" class="btn btn-outline save-btn" data-key="service_2_desc">Save</button></div>
    <div class="admin-field"><label>Service 3 — title</label><input data-key="service_3_title"><button type="button" class="btn btn-outline save-btn" data-key="service_3_title">Save</button></div>
    <div class="admin-field"><label>Service 3 — description</label><input data-key="service_3_desc"><button type="button" class="btn btn-outline save-btn" data-key="service_3_desc">Save</button></div>
    <div class="admin-field"><label>Service 4 — title</label><input data-key="service_4_title"><button type="button" class="btn btn-outline save-btn" data-key="service_4_title">Save</button></div>
    <div class="admin-field"><label>Service 4 — description</label><input data-key="service_4_desc"><button type="button" class="btn btn-outline save-btn" data-key="service_4_desc">Save</button></div>

    <p class="admin-status" id="edit-status"></p>
  </div>

</div>

<script>
  const SUPABASE_URL = "PASTE_YOUR_SUPABASE_URL_HERE";
  const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY_HERE";

  let sessionPassword = null;

  function rpc(fn, body) {
    return fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }

  function loadContent() {
    fetch(SUPABASE_URL + "/rest/v1/site_content?select=key,value", {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY }
    })
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        const map = {};
        (rows || []).forEach(function (row) { map[row.key] = row.value; });
        document.querySelectorAll("[data-key]").forEach(function (el) {
          if (el.tagName === "BUTTON") return;
          const key = el.getAttribute("data-key");
          if (map[key] !== undefined) el.value = map[key];
        });
      });
  }

  document.getElementById("login-btn").addEventListener("click", function () {
    const pw = document.getElementById("admin-password").value;
    const statusEl = document.getElementById("login-status");
    if (SUPABASE_URL.indexOf("PASTE_YOUR") === 0) {
      statusEl.className = "admin-status err";
      statusEl.textContent = "Not connected yet — see ADMIN-SETUP.md.";
      return;
    }
    rpc("admin_check_password", { p_password: pw }).then(function (ok) {
      if (ok === true) {
        sessionPassword = pw;
        document.getElementById("login-view").hidden = true;
        document.getElementById("edit-view").hidden = false;
        loadContent();
      } else {
        statusEl.className = "admin-status err";
        statusEl.textContent = "Wrong password.";
      }
    });
  });

  document.querySelectorAll(".save-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      const key = btn.getAttribute("data-key");
      const field = document.querySelector('[data-key="' + key + '"]:not(.save-btn)');
      const statusEl = document.getElementById("edit-status");
      btn.disabled = true;
      rpc("admin_update_content", { p_key: key, p_value: field.value, p_password: sessionPassword })
        .then(function (ok) {
          statusEl.className = ok === true ? "admin-status ok" : "admin-status err";
          statusEl.textContent = ok === true ? "Saved \u2014 " + key : "Save failed for " + key;
        })
        .catch(function () {
          statusEl.className = "admin-status err";
          statusEl.textContent = "Save failed for " + key;
        })
        .finally(function () { btn.disabled = false; });
    });
  });
</script>
</body>
</html>
